version: '3.8'
services:
  app:
    build: .
    container_name: repartidores-api
    volumes:
      - ./www:/var/www/html
    ports:
      - "8081:80"
    environment:
      - DB_HOST=db
      - DB_NAME=elcerrit_rprtdrs
      - DB_USER=elcerrit_rprtdrs
      - DB_PASS=elcerrit_rprtdrs
    depends_on:
      - db
    networks:
      - logistica_net

  db:
    image: mysql:8.0
    container_name: repartidores-db
    restart: always
    environment:
      MYSQL_DATABASE: elcerrit_rprtdrs
      MYSQL_USER: elcerrit_rprtdrs
      MYSQL_PASSWORD: elcerrit_rprtdrs
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql
    networks:
      - logistica_net

networks:
  logistica_net:
    driver: bridge

volumes:
  mysql_data:
