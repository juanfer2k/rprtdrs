<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Panel Repartidor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=1.1" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="repartidor-view" data-status="unavailable">

<header class="app-header">
    <img src="assets/imgs/logo.png" alt="Logo" class="logo">
    <h1>Panel del Repartidor</h1>
    <button id="theme-toggle" type="button" style="margin-left:auto; border:1px solid #cbd5e1; background:transparent; color:inherit; border-radius:999px; padding:6px 12px; cursor:pointer;">
        🌙 Oscuro
    </button>
</header>

<div id="map"></div>

<div id="status-panel" class="collapsed">
    <div id="panel-toggle"><span>›</span></div>
    <div class="panel-content">

        <div id="profile-section">
            <!-- El perfil se carga automáticamente vía inyección nativa del token/ID -->
            <div id="profile-display">
                <img id="profile-pic" src="assets/imgs/default-user.png" alt="Foto de perfil">
                <div id="profile-details">
                    <h4 id="profile-name">Cargando sesión...</h4>
                    <span id="profile-id">Espere por favor</span>
                </div>
            </div>
        </div>

        <div id="controls-wrapper" class="disabled">
            <h3>Mi Estado</h3>
            <div id="status-display">Actual: <span id="current-status">Cargando...</span></div>
            <button id="status-available">Disponible</button>
            <button id="status-unavailable">No disponible</button>
            <button id="status-pickup">En camino a recoger</button>
            <button id="status-delivered">En camino a entrega</button>
            <button id="status-order-delivered" class="order-delivered-btn">✓ Pedido Entregado</button>
            <button id="get-location">Actualizar Mi Ubicación</button>
            <button id="compass-toggle">Activar Brújula</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const themeToggleBtn = document.getElementById('theme-toggle');

        function renderThemeButton(mode) {
            themeToggleBtn.textContent = mode === 'light' ? '☀️ Claro' : '🌙 Oscuro';
        }

        function applyTheme(theme) {
            const mode = theme === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', mode);
            localStorage.setItem('theme', mode);
            renderThemeButton(mode);
        }

        (function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            applyTheme(savedTheme);
        })();

        themeToggleBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-bs-theme') || 'dark';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        // --- CONFIGURACIÓN ---
        const FALLBACK_NATIVE_BASE_URL = 'https://elcerritovalle.org/rprtdrs/';

        function normalizeBaseUrl(url) {
            if (!url) return '';
            return url.endsWith('/') ? url : `${url}/`;
        }

        function resolveApiBaseUrl() {
            const configuredBaseUrl = normalizeBaseUrl(localStorage.getItem('api_base_url') || '');
            if (configuredBaseUrl) return configuredBaseUrl;

            if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                return FALLBACK_NATIVE_BASE_URL;
            }

            const currentPathBase = `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, '')}`;
            return normalizeBaseUrl(currentPathBase);
        }

        const BASE_URL = resolveApiBaseUrl();
        const TRACK_URL = BASE_URL + 'api/track.php';

        let repartidorId = null;
        let apiToken = null;
        let lastKnownPosition = null;
        let watchId = null;
        let currentEstado = 'No disponible';
        let lastSentAt = 0;
        const SEND_EVERY_MS = 15000;

        const controlsWrapper = document.getElementById('controls-wrapper');
        const statusDisplay = document.getElementById('current-status');
        const panelToggle = document.getElementById('panel-toggle');
        const toastContainer = document.getElementById('toast-container');
        const profileName = document.getElementById('profile-name');
        const profileIdTag = document.getElementById('profile-id');

        const map = L.map('map', { zoomControl: false }).setView([4.60971, -74.08175], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OSM' }).addTo(map);
        const userMarker = L.marker(map.getCenter()).addTo(map).bindPopup("<b>Mi ubicación</b>");

        const statusMap = {
            'status-available': 'Disponible',
            'status-unavailable': 'No disponible',
            'status-pickup': 'En camino a recoger',
            'status-delivered': 'En camino a entrega',
            'status-order-delivered': 'Pedido Entregado'
        };

        // --- FUNCIONES ---

        function checkSession() {
            apiToken = localStorage.getItem('api_token');
            repartidorId = localStorage.getItem('repartidor_id');

            if (apiToken && repartidorId) {
                profileName.textContent = "Repartidor #" + repartidorId;
                profileIdTag.textContent = "Sesión Activa";
                controlsWrapper.classList.remove('disabled');
                startWatchingPosition();
                setStatus('status-unavailable');
                return true;
            }
            return false;
        }

        // Re-intentar cada segundo hasta que la inyección nativa funcione
        const sessionInterval = setInterval(() => {
            if (checkSession()) {
                clearInterval(sessionInterval);
                showToast("Sesión iniciada correctamente", "✓");
            }
        }, 1000);

        function showToast(message, icon) {
            const toast = document.createElement('div');
            toast.className = 'toast show';
            toast.innerHTML = `<div class="icon">${icon || ''}</div><div class="message">${message}</div>`;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function updateLocation(lat, lng) {
            lastKnownPosition = { lat, lng };
            userMarker.setLatLng([lat, lng]);
            map.panTo([lat, lng]);
        }

        async function sendUpdate(force = false) {
            if (!apiToken || !lastKnownPosition) return;
            const now = Date.now();
            if (!force && (now - lastSentAt) < SEND_EVERY_MS) return;
            lastSentAt = now;

            const payload = {
                lat: lastKnownPosition.lat,
                lng: lastKnownPosition.lng,
                estado: currentEstado
            };

            try {
                const response = await fetch(TRACK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiToken}`
                    },
                    body: JSON.stringify(payload),
                    mode: 'cors'
                });

                const result = await response.json();
                if (result.status === 'success') {
                    const indicator = document.getElementById('current-status');
                    indicator.style.color = '#4CAF50';
                    setTimeout(() => indicator.style.color = '', 1000);
                }
            } catch (err) {
                console.error('Error sincronizando:', err);
            }
        }

        async function startWatchingPosition() {
            if (watchId != null) navigator.geolocation.clearWatch(watchId);
            watchId = navigator.geolocation.watchPosition((pos) => {
                updateLocation(pos.coords.latitude, pos.coords.longitude);
                sendUpdate(false);
            }, (err) => {
                showToast("GPS: Permiso denegado o sin señal", "!");
            }, {
                enableHighAccuracy: true,
                timeout: 20000,
                maximumAge: 5000
            });
        }

        function setStatus(newStatusId) {
            const newStatusText = statusMap[newStatusId];
            if (!newStatusText) return;
            currentEstado = newStatusText;
            statusDisplay.textContent = `Actual: ${newStatusText}`;
            document.body.setAttribute('data-status', newStatusId.replace('status-', ''));
            statusButtons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.id === newStatusId) btn.classList.add('active');
            });
            sendUpdate(true);
        }

        const statusButtons = controlsWrapper.querySelectorAll('button[id^="status-"]');
        statusButtons.forEach(btn => btn.addEventListener('click', () => setStatus(btn.id)));
        panelToggle.addEventListener('click', () => document.getElementById('status-panel').classList.toggle('collapsed'));

        document.getElementById('get-location').addEventListener('click', () => {
            showToast("Buscando señal GPS...", "🛰️");
            startWatchingPosition();
        });

        document.getElementById('compass-toggle').addEventListener('click', () => {
            map.setZoom(18);
            showToast("Zoom de precisión activado", "🧭");
        });
    });
</script>

</body>
</html>
