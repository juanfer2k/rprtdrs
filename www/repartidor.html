<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Repartidor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="assets/icon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=6.0" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body data-status="unavailable">

<header class="app-header">
    <img src="assets/imgs/logo.png" alt="Logo" class="logo">
    <h1>Panel del Repartidor</h1>
</header>

<div id="map"></div>

<div id="status-panel" class="collapsed">
    <div id="panel-toggle"><span>›</span></div>
    <div class="panel-content">
        <div id="profile-info">
            <div class="profile-pic"></div>
            <div class="user-id-container">
                <input type="text" id="repartidor-id-input" placeholder="Introduce tu ID de Repartidor">
                <button id="load-profile-btn">Cargar</button>
            </div>
        </div>
        <div id="controls-wrapper" class="disabled">
            <h3>Mi Estado</h3>
            <div id="status-display">Actual: <span id="current-status">No disponible</span></div>
            <button id="status-available">Disponible</button>
            <button id="status-unavailable">No disponible</button>
            <button id="status-pickup">En camino a recoger</button>
            <button id="status-delivered">En camino a entrega</button>
            <button id="status-order-delivered" class="order-delivered-btn">✓ Pedido Entregado</button>
            <button id="get-location">Actualizar Mi Ubicación</button>
            <button id="compass-toggle">Activar Brújula</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        let repartidorId = null;
        let lastKnownPosition = null;

        const idInput = document.getElementById('repartidor-id-input');
        const loadProfileBtn = document.getElementById('load-profile-btn');
        const controlsWrapper = document.getElementById('controls-wrapper');
        const statusDisplay = document.getElementById('current-status');
        const statusButtons = controlsWrapper.querySelectorAll('button[id^="status-"]');
        const panelToggle = document.getElementById('panel-toggle');
        const toastContainer = document.getElementById('toast-container');

        const statusMap = {
            'status-available': 'Disponible',
            'status-unavailable': 'No disponible',
            'status-pickup': 'En camino a recoger',
            'status-delivered': 'En camino a entrega',
            'status-order-delivered': 'Pedido Entregado'
        };
        const statusIcons = {
            'available': '✓',
            'unavailable': '✗',
            'pickup': '→',
            'delivered': '★',
            'order-delivered': '🏁'
        };

        const map = L.map('map').setView([4.60971, -74.08175], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
        const userMarker = L.marker(map.getCenter()).addTo(map).bindPopup("<b>Mi ubicación</b>");

        function showToast(message, icon) {
            const toast = document.createElement('div');
            toast.className = 'toast show';
            toast.innerHTML = `<div class="icon">${icon}</div><div class="message">${message}</div>`;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function updateLocation(lat, lng) {
            lastKnownPosition = { lat, lng };
            const newPos = [lat, lng];
            if (!map.getBounds().contains(newPos)) map.setView(newPos, 17);
            userMarker.setLatLng(newPos);
        }

        function requestLocationPermissions() {
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    pos => updateLocation(pos.coords.latitude, pos.coords.longitude),
                    err => { if (err.code === 1) showToast("Permiso de ubicación denegado", "!"); },
                    { enableHighAccuracy: true }
                );
            } else {
                showToast("Geolocalización no disponible", "!");
            }
        }

        async function updateStatusOnServer(newStatus) {
            if (!repartidorId) return;
            let data = { id_repartidor: repartidorId, estado: newStatus };
            if (lastKnownPosition) {
                data.latitud = lastKnownPosition.lat;
                data.longitud = lastKnownPosition.lng;
            }

            try {
                const response = await fetch('actualizar_estado.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                const result = await response.json();
                if (result.status !== 'success' && result.status !== 'warning') throw new Error(result.message);
                console.log("Respuesta del servidor:", result.message);
            } catch (error) {
                console.error("Error al actualizar estado:", error);
                showToast("Error al guardar", "!");
            }
        }

        function setStatus(newStatusId) {
            if(statusMap[newStatusId]){
                const newStatusText = statusMap[newStatusId];
                const status = newStatusId.replace('status-', '');

                statusDisplay.textContent = `Actual: ${newStatusText}`;
                document.body.setAttribute('data-status', status);
                showToast(newStatusText, statusIcons[status]);

                statusButtons.forEach(btn => {
                    if (btn.id === newStatusId) btn.classList.add('active');
                    else btn.classList.remove('active');
                });
                updateStatusOnServer(newStatusText);
            }
        }

        loadProfileBtn.addEventListener('click', () => {
            const enteredId = idInput.value.trim();
            if (enteredId) {
                repartidorId = enteredId;
                idInput.disabled = true;
                loadProfileBtn.textContent = 'Cargado';
                loadProfileBtn.disabled = true;
                controlsWrapper.classList.remove('disabled');
                showToast(`Perfil ${repartidorId} cargado.`, '✓');
                requestLocationPermissions();
                setStatus('status-unavailable');
            } else {
                showToast('Por favor, introduce un ID.', '!');
            }
        });

        statusButtons.forEach(btn => btn.addEventListener('click', () => setStatus(btn.id)));
        panelToggle.addEventListener('click', () => document.getElementById('status-panel').classList.toggle('collapsed'));
        document.getElementById('get-location').addEventListener('click', requestLocationPermissions);
    });
</script>

</body>
</html>
